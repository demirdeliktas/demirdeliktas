<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="size" content="1080x1350"><title>İlan Postu</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 1080px; height: 1350px; background: var(--paper); }
  .frame { width: 1080px; height: 1350px; }
  .photo { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; object-fit: cover; object-position: 50% 60%; }
  .tag { position: absolute; left: 64px; top: 56px; }
  .content { position: absolute; left: 64px; right: 64px; top: 696px; }
  .label { color: var(--gold); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; gap: 24px; }
  h1 { font-weight: 600; font-size: 52px; letter-spacing: -.025em; line-height: 1.1; }
  .price { font-size: 58px; white-space: nowrap; line-height: 1; }
  .features { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .feat { display: flex; align-items: center; gap: 18px; padding: 24px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .feat b { display: block; font-weight: 600; font-size: 25px; line-height: 1.1; }
  .feat span { display: block; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 56px; }
  .foot .rule { margin-bottom: 30px; }
  .foot-row { display: flex; justify-content: space-between; align-items: center; }
  .contact { text-align: right; }
  .contact b { display: block; font-weight: 600; font-size: 30px; letter-spacing: .02em; }
  .contact span { display: block; font-size: 15px; letter-spacing: .14em; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
  .concept { right: 64px; bottom: 18px; color: var(--muted); }
</style></head>
<body><div class="frame">
  <img class="photo" src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=85" alt="">
  <span class="tag">Satılık</span>
  <span class="concept">Konsept çalışma</span>

  <div class="content">
    <p class="label">Çayyolu · Çankaya / Ankara</p>
    <div class="head">
      <h1>Çayyolu'nda<br>Site İçi 3+1</h1>
      <p class="price">8.750.000<span class="cur">₺</span></p>
    </div>

    <div class="features">
      <div class="feat"><svg class="ico" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M7 17 17 7M13 7h4v4M11 17H7v-4"/></svg><div><b>145 m²</b><span>Brüt alan</span></div></div>
      <div class="feat"><svg class="ico" viewBox="0 0 24 24"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 15h18M6 10V7.5A1.5 1.5 0 0 1 7.5 6h3A1.5 1.5 0 0 1 12 7.5V10M12 10V7.5A1.5 1.5 0 0 1 13.5 6h3A1.5 1.5 0 0 1 18 7.5V10M3 18v2M21 18v2"/></svg><div><b>3+1</b><span>Oda sayısı</span></div></div>
      <div class="feat"><svg class="ico" viewBox="0 0 24 24"><path d="M5 21V4h14v17M3 21h18M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/></svg><div><b>4. kat</b><span>Bulunduğu kat</span></div></div>
      <div class="feat"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9.5 17V7h3.5a3 3 0 0 1 0 6H9.5"/></svg><div><b>Otopark</b><span>Kapalı</span></div></div>
      <div class="feat"><svg class="ico" viewBox="0 0 24 24"><path d="M2 19c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M8 15V6a2 2 0 0 1 4 0M16 15V6a2 2 0 0 0-4 0M8 10h8"/></svg><div><b>Havuz</b><span>Site içi</span></div></div>
      <div class="feat"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3Z"/><path d="M9 12l2 2 4-4"/></svg><div><b>24 saat</b><span>Güvenlik</span></div></div>
    </div>
  </div>

  <div class="foot">
    <div class="rule"></div>
    <div class="foot-row">
      <div class="logo"><div class="logo-mark">ÇG</div><div class="logo-text"><b>Çayyolu</b><span>Gayrimenkul</span></div></div>
      <div class="contact"><b>0312 000 00 00</b><span>Yetki Belge No: 0600000</span></div>
    </div>
  </div>
</div></body></html>
